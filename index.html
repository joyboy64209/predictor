<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="VELOCITY SPORTS — Live football match predictions." />
  <title>VELOCITY SPORTS | Live Predictions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search for teams, players, or events"
          autocomplete="off"
        />
      </div>
      <button class="btn-all-events" id="allEventsBtn">
        <span>All Events</span>
        <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/></svg>
      </button>
    </header>

    <!-- Main content -->
    <main class="content">
      <section class="section-head">
        <h2 class="section-title">FEATURED LIVE MATCHES</h2>
      </section>

      <!-- Loading state -->
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p>Loading live matches...</p>
      </div>

      <!-- Error state -->
      <div id="error" class="error" hidden>
        <p id="errorMessage">Something went wrong.</p>
        <button id="retryBtn" class="btn btn-ghost">Retry</button>
      </div>

      <!-- Match list -->
      <section id="matchList" class="match-list" aria-live="polite"></section>

      <!-- Action buttons -->
      <div class="actions" id="actions" hidden>
        <button class="btn btn-secondary" id="toggleAllBtn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          <span>TOGGLE ALL</span>
        </button>
        <button class="btn btn-primary" id="runPredictionBtn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>RUN PREDICTION</span>
        </button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
