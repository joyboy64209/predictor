<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="VELOCITY SPORTS — Pre-match football predictions with 75% confidence threshold." />
  <title>VELOCITY SPORTS | Football Predictions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- File protocol warning -->
    <div id="fileWarning" class="file-warning" hidden>
      <div class="file-warning-inner">
        <span class="file-warning-icon">⚠️</span>
        <div>
          <strong>Local file detected</strong>
          <p>You are opening this page directly from a file. The API proxy won't work. Please run <code>npx vercel dev</code> in the project folder and open <code>http://localhost:3000</code> instead.</p>
        </div>
      </div>
    </div>

    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="brand">
        <span class="brand-badge">VS</span>
        <h1 class="brand-name">VELOCITY <span>SPORTS</span></h1>
      </div>
      <div class="search-wrap">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search teams or leagues..."
          autocomplete="off"
        />
      </div>
    </header>

    <!-- Main content -->
    <main class="content">
      <section class="section-head">
        <h2 class="section-title">Upcoming Fixtures</h2>
        <span class="section-sub" id="updatedLabel">—</span>
      </section>

      <!-- Loading state -->
      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p>Loading predictions...</p>
      </div>

      <!-- Error state -->
      <div id="error" class="error" hidden>
        <p id="errorMessage">Something went wrong.</p>
        <button id="retryBtn" class="btn btn-ghost">Retry</button>
      </div>

      <!-- Match list -->
      <section id="matchList" class="match-list" aria-live="polite"></section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-view="live">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Live</span>
      </button>
      <button class="nav-item" data-view="bets">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4z"/></svg>
        <span>My Bets</span>
      </button>
      <button class="nav-item" data-view="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
